"""
processor.py
------------
Core logic for Shopee Stock Validation.
Compares a Graas StockValidation CSV against a Shopee
mass_update_sales_info ZIP (containing one or more .xlsx files).

Remark priority:
  1. SKU not in mass-update file  → NOT IN S&P
  2. Expected == 0 AND SP_Qty > 0 → UPDATE 0
  3. Expected != SP_Qty           → IMPACT
  4. Expected == SP_Qty           → TRUE  (Match)
"""

from __future__ import annotations

import io
import re
import zipfile
from dataclasses import dataclass

import pandas as pd
from openpyxl import Workbook
from openpyxl.styles import Alignment, Border, Font, PatternFill, Side
from openpyxl.utils import get_column_letter


# ── Colour palette ────────────────────────────────────────────────────────────
HDR_FILL  = PatternFill("solid", fgColor="1F3864")
HDR_FONT  = Font(bold=True, color="FFFFFF", name="Arial", size=11)
TRUE_FILL = PatternFill("solid", fgColor="C6EFCE")
TRUE_FONT = Font(bold=True, color="375623", name="Arial", size=10)
MISS_FILL = PatternFill("solid", fgColor="FFC7CE")
MISS_FONT = Font(bold=True, color="9C0006", name="Arial", size=10)
UPD0_FILL = PatternFill("solid", fgColor="FFEB9C")
UPD0_FONT = Font(bold=True, color="7D4800", name="Arial", size=10)
NISP_FILL = PatternFill("solid", fgColor="D9D9D9")
NISP_FONT = Font(bold=True, color="595959", name="Arial", size=10)
ALT_FILL  = PatternFill("solid", fgColor="F2F7FB")
THIN_BORDER = Border(
    left=Side(style="thin", color="BFBFBF"),
    right=Side(style="thin", color="BFBFBF"),
    top=Side(style="thin", color="BFBFBF"),
    bottom=Side(style="thin", color="BFBFBF"),
)

REMARK_STYLE: dict[str, tuple[PatternFill, Font]] = {
    "TRUE":       (TRUE_FILL, TRUE_FONT),
    "IMPACT":     (MISS_FILL, MISS_FONT),
    "UPDATE 0":   (UPD0_FILL, UPD0_FONT),
    "NOT IN S&P": (NISP_FILL, NISP_FONT),
}


# ── Data classes ──────────────────────────────────────────────────────────────
@dataclass
class ValidationResult:
    full_df: pd.DataFrame
    mismatch_df: pd.DataFrame
    total: int
    match: int
    impact: int
    update0: int
    not_in_sp: int

    @property
    def mismatch(self) -> int:
        return self.impact + self.update0 + self.not_in_sp


# ── Helper: fix malformed xlsx from Shopee ────────────────────────────────────
def _fix_xlsx_bytes(raw_bytes: bytes) -> io.BytesIO:
    """
    Shopee-exported xlsx files sometimes contain an invalid ``activePane``
    attribute in the sheet XML.  This function strips it before parsing.
    """
    buf = io.BytesIO()
    with (
        zipfile.ZipFile(io.BytesIO(raw_bytes), "r") as inner,
        zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zout,
    ):
        for item in inner.infolist():
            data = inner.read(item.filename)
            if item.filename.startswith("xl/worksheets/") and item.filename.endswith(".xml"):
                text = data.decode("utf-8", errors="replace")
                text = re.sub(r'activePane="[^"]*"', "", text)
                data = text.encode("utf-8")
            zout.writestr(item, data)
    buf.seek(0)
    return buf


# ── Loaders ───────────────────────────────────────────────────────────────────
def load_mass_update_zip(zip_file: bytes | str) -> pd.DataFrame:
    """
    Load all .xlsx files from a Shopee mass_update_sales_info ZIP.

    Accepts either a file path (str) or raw bytes.

    Returns a combined DataFrame with columns:
        SKU (str), Stock (int), Product Name (str), Price (float)
    """
    if isinstance(zip_file, (str,)):
        with open(zip_file, "rb") as f:
            zip_file = f.read()

    dfs: list[pd.DataFrame] = []
    with zipfile.ZipFile(io.BytesIO(zip_file), "r") as z:
        xlsx_files = [n for n in z.namelist() if n.endswith(".xlsx")]
        for fn in xlsx_files:
            raw = z.read(fn)
            fixed_buf = _fix_xlsx_bytes(raw)
            df = pd.read_excel(
                fixed_buf,
                header=2,
                skiprows=[3, 4, 5],
                engine="openpyxl",
            )
            dfs.append(df)

    if not dfs:
        raise ValueError("No .xlsx files found inside the ZIP archive.")

    combined = pd.concat(dfs, ignore_index=True)
    combined["SKU"]   = combined["SKU"].astype(str).str.strip()
    combined["Stock"] = pd.to_numeric(combined["Stock"], errors="coerce").fillna(0).astype(int)
    return combined


def load_stock_validation_csv(csv_file: bytes | str) -> pd.DataFrame:
    """
    Load a Graas StockValidation CSV.

    Accepts either a file path (str) or raw bytes.
    """
    if isinstance(csv_file, (str,)):
        sv = pd.read_csv(csv_file)
    else:
        sv = pd.read_csv(io.BytesIO(csv_file))

    sv.columns = sv.columns.str.strip()
    sv["Seller SKU"] = sv["Seller SKU"].astype(str).str.strip()
    return sv


# ── Core validation ───────────────────────────────────────────────────────────
def validate(sv: pd.DataFrame, sp: pd.DataFrame) -> ValidationResult:
    """
    Compare StockValidation against mass-update data.

    Parameters
    ----------
    sv : StockValidation DataFrame (output of load_stock_validation_csv)
    sp : mass-update DataFrame    (output of load_mass_update_zip)

    Returns
    -------
    ValidationResult
    """
    sp_lookup: dict[str, int] = sp.groupby("SKU")["Stock"].sum().to_dict()

    def _classify(row: pd.Series) -> pd.Series:
        exp = int(row["Expected Stock"]) if pd.notna(row["Expected Stock"]) else 0
        sp_qty = sp_lookup.get(row["Seller SKU"], None)

        if sp_qty is None:
            return pd.Series([0, "Mismatch", "NOT IN S&P"])
        sp_qty = int(sp_qty)
        if exp == 0 and sp_qty > 0:
            return pd.Series([sp_qty, "Mismatch", "UPDATE 0"])
        if exp != sp_qty:
            return pd.Series([sp_qty, "Mismatch", "IMPACT"])
        return pd.Series([sp_qty, "Match", "TRUE"])

    sv = sv.copy()
    sv[["SP_Quantity", "Status", "Remark"]] = sv.apply(_classify, axis=1)

    mismatch_df = sv[sv["Status"] == "Mismatch"].copy()

    return ValidationResult(
        full_df=sv,
        mismatch_df=mismatch_df,
        total=len(sv),
        match=int((sv["Remark"] == "TRUE").sum()),
        impact=int((sv["Remark"] == "IMPACT").sum()),
        update0=int((sv["Remark"] == "UPDATE 0").sum()),
        not_in_sp=int((sv["Remark"] == "NOT IN S&P").sum()),
    )


# ── Excel export ──────────────────────────────────────────────────────────────
def _write_sheet(ws, df: pd.DataFrame) -> None:
    ws.sheet_view.showGridLines = False
    ws.freeze_panes = "A2"
    ws.auto_filter.ref = ws.dimensions

    # Header row
    for ci, col in enumerate(df.columns, 1):
        cell = ws.cell(row=1, column=ci, value=col)
        cell.fill = HDR_FILL
        cell.font = HDR_FONT
        cell.alignment = Alignment(horizontal="center", vertical="center", wrap_text=True)
        cell.border = THIN_BORDER
    ws.row_dimensions[1].height = 30

    # Data rows
    for ri, (_, row) in enumerate(df.iterrows(), 2):
        remark = row.get("Remark", "") if "Remark" in df.columns else ""
        fill, font = REMARK_STYLE.get(remark, (None, Font(name="Arial", size=10)))
        for ci, col in enumerate(df.columns, 1):
            cell = ws.cell(row=ri, column=ci, value=row[col])
            cell.border = THIN_BORDER
            if fill:
                cell.fill = fill
                cell.font = font
            else:
                cell.font = Font(name="Arial", size=10)
                if ri % 2 == 0:
                    cell.fill = ALT_FILL

    # Column widths
    for ci, col in enumerate(df.columns, 1):
        sample = [str(df.iloc[r, ci - 1]) for r in range(min(len(df), 300))]
        max_len = max(len(str(col)), *(len(s) for s in sample), default=10)
        ws.column_dimensions[get_column_letter(ci)].width = min(max_len + 2, 42)


def build_excel_report(result: ValidationResult) -> io.BytesIO:
    """
    Build and return an in-memory Excel workbook from a ValidationResult.
    """
    wb = Workbook()

    # ── Summary sheet ──────────────────────────────────────────────────────
    ws_sum = wb.active
    ws_sum.title = "Summary"
    ws_sum.sheet_view.showGridLines = False
    ws_sum.column_dimensions["A"].width = 36
    ws_sum.column_dimensions["B"].width = 18

    summary_rows = [
        ("Shopee StockValidation vs Mass Update",  "",                 PatternFill("solid", fgColor="1F3864"), Font(bold=True, color="FFFFFF", name="Arial", size=12)),
        ("Total SKUs",                              result.total,       None,                                   Font(name="Arial", size=10)),
        ("Match (TRUE)",                            result.match,       TRUE_FILL,                              TRUE_FONT),
        ("Mismatch Total",                          result.mismatch,    MISS_FILL,                              MISS_FONT),
        ("  → IMPACT",                              result.impact,      MISS_FILL,                              Font(color="9C0006", name="Arial", size=10)),
        ("  → UPDATE 0",                            result.update0,     UPD0_FILL,                              Font(color="7D4800", name="Arial", size=10)),
        ("  → NOT IN S&P",                          result.not_in_sp,   NISP_FILL,                              Font(color="595959", name="Arial", size=10)),
    ]
    for ri, (label, value, fill, font) in enumerate(summary_rows, 2):
        for ci, v in enumerate([label, value], 1):
            cell = ws_sum.cell(row=ri, column=ci, value=v)
            cell.border = THIN_BORDER
            cell.alignment = Alignment(horizontal="left", vertical="center")
            cell.font = font
            if fill:
                cell.fill = fill
        ws_sum.row_dimensions[ri].height = 22

    # ── Full data sheet ────────────────────────────────────────────────────
    ws_sv = wb.create_sheet("StockVal + Remark")
    _write_sheet(ws_sv, result.full_df)

    # ── Mismatch sheet ─────────────────────────────────────────────────────
    ws_mm = wb.create_sheet("Mismatch Summary")
    _write_sheet(ws_mm, result.mismatch_df)

    buf = io.BytesIO()
    wb.save(buf)
    buf.seek(0)
    return buf

# 📦 Shopee Stock Validator

A Streamlit web app that compares a **Graas StockValidation CSV** against a
**Shopee `mass_update_sales_info` ZIP** and produces a colour-coded Excel report.

---

## Remark Logic

| Priority | Condition | Status | Remark |
|---|---|---|---|
| 1 | SKU not found in ZIP | Mismatch | `NOT IN S&P` |
| 2 | Expected == 0 AND ZIP Qty > 0 | Mismatch | `UPDATE 0` |
| 3 | Expected ≠ ZIP Qty | Mismatch | `IMPACT` |
| 4 | Expected == ZIP Qty | Match | `TRUE` |

---

## Project Structure

```
shopee-stock-validator/
├── app.py            # Streamlit UI
├── processor.py      # Core validation & Excel export logic
├── requirements.txt
└── README.md
```

