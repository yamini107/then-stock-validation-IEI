## Colour Legend

| Colour | Remark | Meaning |
|---|---|---|
| 🟢 Green | `TRUE` | Stock matches |
| 🔴 Red | `IMPACT` | Stock quantity differs |
| 🟡 Yellow | `UPDATE 0` | Shopee shows stock but expected is 0 — needs zeroing |
| ⚪ Grey | `NOT IN S&P` | SKU missing from mass-update file |

