    def _show_df(df: pd.DataFrame) -> None:
        if df.empty:
            st.info("No records in this category.")
            return
        styled = df.style.applymap(_colour_remark_col, subset=["Remark"]) if "Remark" in df.columns else df.style
        st.dataframe(styled, use_container_width=True, height=420)

    with tab_all:
        _show_df(result.full_df)

    with tab_mismatch:
        _show_df(result.mismatch_df)

    with tab_impact:
        _show_df(result.full_df[result.full_df["Remark"] == "IMPACT"])

