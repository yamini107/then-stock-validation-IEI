        _show_df(result.full_df[result.full_df["Remark"] == "UPDATE 0"])

    with tab_nisp:
        _show_df(result.full_df[result.full_df["Remark"] == "NOT IN S&P"])

    # ── Download ───────────────────────────────────────────────────────────
    st.markdown("")
    timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
    st.download_button(
